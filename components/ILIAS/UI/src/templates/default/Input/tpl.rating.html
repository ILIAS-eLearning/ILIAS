<div class="c-field-rating" id="{ID}" name="{NAME}" aria-labelledby="{LABEL_ID}" <!-- BEGIN describedby --> aria-describedby="{DESCRIBED_BY}"<!-- END describedby --><!-- BEGIN disabled --> disabled="disabled"<!-- END disabled --> role="radiogroup">
	<div class="il-field-rating__stars" <!-- BEGIN average_title --> title="{AVERAGE_VALUE}"<!-- END average_title -->>
        <!-- BEGIN average -->
        <div class="il-field-rating__average">
            <div class="il-input-rating__average_value" style="width:{AVERAGE_VALUE_PERCENT}%;"></div>
        </div>
        <!-- END average -->
        <!-- BEGIN optionblock -->
        <div class="c-field-rating__star">
             <input type="radio" id="{OPTION_ID}"<!-- BEGIN option_name --> name="{OPTION_NAME}"<!-- END option_name --> value="{OPTION_VALUE}"<!-- BEGIN option_disabled --> disabled="disabled"<!-- END option_disabled --><!-- BEGIN option_checked --> checked="checked"<!-- END option_checked -->/>
			<label class="glyphicon-star il-input-rating-star" for="{OPTION_ID}"><span class="sr-only">{OPTION_ARIALABEL}"</span></label>
        </div>
        <!-- END optionblock -->
    </div>
    <!-- BEGIN option_neutral -->
    <div class="il-input-rating__none">
        <label for="{NEUTRAL_ID}">{NEUTRAL_LABEL}</label>
        <input type="radio" id="{NEUTRAL_ID}" name="{NEUTRAL_NAME}" value="0"<!-- BEGIN neutral_disabled --> disabled="disabled"<!-- END neutral_disabled --><!-- BEGIN neutral_checked --> checked="checked"<!-- END neutral_checked -->/>
    </div>
    <!-- END option_neutral -->
</div>
