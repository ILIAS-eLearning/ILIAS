<button data-transfer-type="{TRANSFER_TYPE}" class="btn btn-default" aria-live="polite">
    <span data-transfer-status="default" class="visible">
        {DEFAULT_GLYPH}
        <span class="{MESSAGE_VISIBILITY}">{DEFAULT_MESSAGE}</span>
    </span>
    <span data-transfer-status="success" class="hidden">
        {SUCCESS_GLYPH}
        <span class="{MESSAGE_VISIBILITY}">{SUCCESS_MESSAGE}</span>
    </span>
    <span data-transfer-status="failure" class="hidden">
        {FAILURE_GLYPH}
        <span class="{MESSAGE_VISIBILITY}">{FAILURE_MESSAGE}</span>
    </span>
</button>
