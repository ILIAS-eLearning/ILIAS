<button data-transfer-type="{TRANSFER_TYPE}" class="btn btn-default" aria-label="{ARIA_LABEL}">
    <span data-transfer-status="default" class="visible">{DEFAULT_GLYPH}</span>
    <span data-transfer-status="success" data-transfer-message="{SUCCESS_MESSAGE}" class="hidden">{SUCCESS_GLYPH}</span>
    <span data-transfer-status="failure" data-transfer-message="{FAILURE_MESSAGE}" class="hidden">{FAILURE_GLYPH}</span>
    <span>{VISIBLE_LABEL}</span>
</button>
