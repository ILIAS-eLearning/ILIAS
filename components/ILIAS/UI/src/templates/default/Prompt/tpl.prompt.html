<div class="c-prompt" id="{ID}">
    <dialog aria-labelledby="{ID}_title">
        <div class="c-prompt__header">
            <form class="c-prompt__close">
                <button formmethod="dialog" class="close" aria-label="{CLOSE_LABEL}">
                    <span aria-hidden="true">&times;</span>
                </button>
            </form>
            <span class="c-prompt__title" id="{ID}_title">{TITLE}</span>
        </div>
        <hr>
        <div class="c-prompt__contents"></div>
        <hr>
        <div class="c-prompt__buttons">
            <form class="c-prompt__close">
                <button formmethod="dialog" class="btn btn-default" >{CLOSE_LABEL}</button>
            </form>
        </div>
        <section class="c-prompt__scripts"></section>
    </dialog>
    <template>{ERROR_MESSAGE_BOX}</template>
</div>
