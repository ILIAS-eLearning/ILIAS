<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2020 1576" width="2020" height="1576" role="img"
     aria-label="Sequence of ILIAS web push subscription and delivery">
  <title>ILIAS 11 - Web Push: sequence from consent to delivery</title>
  <defs>
    <style>
      text { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1 { font-size: 28px; font-weight: 700; fill: #1a202c; }
      .h2 { font-size: 14px; fill: #4a5568; }
      .an { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .as { font-size: 10.5px; fill: #ffffff; opacity: 0.9; }
      .ph { font-size: 14px; font-weight: 700; }
      .ml { font-size: 12.5px; font-weight: 600; fill: #1a202c; }
      .ms { font-size: 11px; fill: #4a5568; }
      .num { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .bul { font-size: 12.5px; fill: #2d3748; }
    </style>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker>
  </defs>
  <rect x="0" y="0" width="2020" height="1576" fill="#f6f8fb"/>
  <text class="h1" x="40" y="44">ILIAS 11 &#8212; Web Push sequence: consent, subscription, delivery</text>
  <text class="h2" x="40" y="70">Default configuration: VAPID + RFC 8291 aes128gcm. The browser chooses the vendor push service; ILIAS only stores and later POSTs to that endpoint.</text>
  <text class="h2" x="40" y="90">Solid orange = opt-in (once per browser). Solid blue = later delivery. Dashed grey = reply. Steps 1-22 in chronological order.</text>
  <line x1="130" y1="156" x2="130" y2="1354" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="5 5"/>  <rect x="52" y="108" width="156" height="48" rx="8" fill="#285e61"/>  <text class="an" x="130" y="136" text-anchor="middle">User</text>  <line x1="400" y1="156" x2="400" y2="1354" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="5 5"/>  <rect x="322" y="108" width="156" height="48" rx="8" fill="#276749"/>  <text class="an" x="400" y="128" text-anchor="middle">Browser</text>  <text class="as" x="400" y="144" text-anchor="middle">page + Push API</text>  <line x1="820" y1="156" x2="820" y2="1354" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="5 5"/>  <rect x="742" y="108" width="156" height="48" rx="8" fill="#2b4f7d"/>  <text class="an" x="820" y="128" text-anchor="middle">ILIAS PHP</text>  <text class="as" x="820" y="144" text-anchor="middle">ilias.php / curl</text>  <line x1="1120" y1="156" x2="1120" y2="1354" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="5 5"/>  <rect x="1042" y="108" width="156" height="48" rx="8" fill="#975a16"/>  <text class="an" x="1120" y="128" text-anchor="middle">Database</text>  <text class="as" x="1120" y="144" text-anchor="middle">push_subscriptions</text>  <line x1="1420" y1="156" x2="1420" y2="1354" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="5 5"/>  <rect x="1342" y="108" width="156" height="48" rx="8" fill="#9c4221"/>  <text class="an" x="1420" y="128" text-anchor="middle">Push Service</text>  <text class="as" x="1420" y="144" text-anchor="middle">FCM / Autopush / APNs</text>  <line x1="1680" y1="156" x2="1680" y2="1354" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="5 5"/>  <rect x="1602" y="108" width="156" height="48" rx="8" fill="#22613f"/>  <text class="an" x="1680" y="128" text-anchor="middle">Service Worker</text>  <text class="as" x="1680" y="144" text-anchor="middle">/service-worker.js</text>  <line x1="1900" y1="156" x2="1900" y2="1354" stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="5 5"/>  <rect x="1822" y="108" width="156" height="48" rx="8" fill="#2c7a7b"/>  <text class="an" x="1900" y="128" text-anchor="middle">OS / Notify</text>  <text class="as" x="1900" y="144" text-anchor="middle">banner / lock screen</text>  <rect x="20" y="168" width="1980" height="28" rx="6" fill="#fff5e9" stroke="#c05621"/>  <text class="ph" x="36" y="187" fill="#9c4221">Phase A  &#8212;  Opt-in and subscription  (once per browser / device)</text>  <line x1="142" y1="202" x2="388" y2="202" stroke="#c05621" stroke-width="2" marker-end="url(#arrS)"/>  <circle cx="156" cy="202" r="11" fill="#c05621"/>  <text class="num" x="156" y="206" text-anchor="middle">1</text>  <text class="ml" x="422" y="200" text-anchor="start">clicks toggle ON</text>  <text class="ms" x="422" y="216" text-anchor="start">Settings > Push Notifications</text>  <line x1="388" y1="252" x2="142" y2="252" stroke="#718096" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrR)"/>  <circle cx="374" cy="252" r="11" fill="#718096"/>  <text class="num" x="374" y="256" text-anchor="middle">2</text>  <text class="ml" x="422" y="250" text-anchor="start">requestPermission()</text>  <text class="ms" x="422" y="266" text-anchor="start">browser / OS dialog</text>  <line x1="142" y1="302" x2="388" y2="302" stroke="#c05621" stroke-width="2" marker-end="url(#arrS)"/>  <circle cx="156" cy="302" r="11" fill="#c05621"/>  <text class="num" x="156" y="306" text-anchor="middle">3</text>  <text class="ml" x="422" y="300" text-anchor="start">grants permission</text>  <text class="ms" x="422" y="316" text-anchor="start">denied aborts the flow</text>  <line x1="412" y1="352" x2="1408" y2="352" stroke="#c05621" stroke-width="2" marker-end="url(#arrS)"/>  <circle cx="426" cy="352" r="11" fill="#c05621"/>  <text class="num" x="426" y="356" text-anchor="middle">4</text>  <text class="ml" x="910.0" y="343" text-anchor="middle">pushManager.subscribe({ userVisibleOnly, applicationServerKey })</text>  <text class="ms" x="910.0" y="368" text-anchor="middle">VAPID public key from ilSetting application_server_key</text>  <line x1="1408" y1="402" x2="412" y2="402" stroke="#718096" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrR)"/>  <circle cx="1394" cy="402" r="11" fill="#718096"/>  <text class="num" x="1394" y="406" text-anchor="middle">5</text>  <text class="ml" x="910.0" y="393" text-anchor="middle">returns { endpoint, p256dh, auth }</text>  <text class="ms" x="910.0" y="418" text-anchor="middle">browser picks FCM / Autopush / APNs; ILIAS never chooses the host</text>  <line x1="412" y1="452" x2="808" y2="452" stroke="#c05621" stroke-width="2" marker-end="url(#arrS)"/>  <circle cx="426" cy="452" r="11" fill="#c05621"/>  <text class="num" x="426" y="456" text-anchor="middle">6</text>  <text class="ml" x="610.0" y="443" text-anchor="middle">POST cmd=addSubscription</text>  <text class="ms" x="610.0" y="468" text-anchor="middle">FormData: JSON.stringify(newSub.toJSON())</text>  <line x1="832" y1="502" x2="1108" y2="502" stroke="#c05621" stroke-width="2" marker-end="url(#arrS)"/>  <circle cx="846" cy="502" r="11" fill="#c05621"/>  <text class="num" x="846" y="506" text-anchor="middle">7</text>  <text class="ml" x="970.0" y="493" text-anchor="middle">INSERT push_subscriptions</text>  <text class="ms" x="970.0" y="518" text-anchor="middle">endpoint, user_id, p256dh, auth (PK)</text>  <line x1="832" y1="552" x2="1408" y2="552" stroke="#c05621" stroke-width="2" marker-end="url(#arrS)"/>  <circle cx="846" cy="552" r="11" fill="#c05621"/>  <text class="num" x="846" y="556" text-anchor="middle">8</text>  <text class="ml" x="1120.0" y="543" text-anchor="middle">confirmation push (InternalPushProvider)</text>  <text class="ms" x="1120.0" y="568" text-anchor="middle">same encrypt + VAPID path as 13-19; user-pref check skipped</text>  <rect x="20" y="612" width="1980" height="28" rx="6" fill="#eaf1fa" stroke="#2b6cb0"/>  <text class="ph" x="36" y="631" fill="#2b4f7d">Phase B  &#8212;  Delivery  (later, per notification, one curl POST per stored subscription)</text>  <path d="M820 646 h44 v16 h-44" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <rect x="814" y="638" width="12" height="28" rx="2" fill="#2b6cb0" opacity="0.25"/>  <circle cx="798" cy="646" r="11" fill="#2b6cb0"/>  <text class="num" x="798" y="650" text-anchor="middle">9</text>  <text class="ml" x="792" y="650" text-anchor="end">push(user, title, desc, link)</text>  <text class="ms" x="792" y="664" text-anchor="end">NotificationsPushProvider  |  ttl = 60 s</text>  <path d="M820 696 h44 v16 h-44" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <rect x="814" y="688" width="12" height="28" rx="2" fill="#2b6cb0" opacity="0.25"/>  <circle cx="798" cy="696" r="11" fill="#2b6cb0"/>  <text class="num" x="798" y="700" text-anchor="middle">10</text>  <text class="ml" x="792" y="700" text-anchor="end">notify(): checks</text>  <text class="ms" x="792" y="714" text-anchor="end">enable_push=1 and provider id in usr_pref</text>  <line x1="832" y1="746" x2="1108" y2="746" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="846" cy="746" r="11" fill="#2b6cb0"/>  <text class="num" x="846" y="750" text-anchor="middle">11</text>  <text class="ml" x="970.0" y="737" text-anchor="middle">SELECT subscriptions</text>  <text class="ms" x="970.0" y="762" text-anchor="middle">WHERE user_id = ?  |  one row per device</text>  <line x1="1108" y1="796" x2="832" y2="796" stroke="#718096" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrR)"/>  <circle cx="1094" cy="796" r="11" fill="#718096"/>  <text class="num" x="1094" y="800" text-anchor="middle">12</text>  <text class="ml" x="970.0" y="787" text-anchor="middle">n rows { endpoint, p256dh, auth }</text>  <text class="ms" x="970.0" y="812" text-anchor="middle">one curl POST per row</text>  <path d="M820 846 h44 v16 h-44" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <rect x="814" y="838" width="12" height="28" rx="2" fill="#2b6cb0" opacity="0.25"/>  <circle cx="798" cy="846" r="11" fill="#2b6cb0"/>  <text class="num" x="798" y="850" text-anchor="middle">13</text>  <text class="ml" x="792" y="850" text-anchor="end">encrypt + VAPID JWT</text>  <text class="ms" x="792" y="864" text-anchor="end">AES-128-GCM  |  aud = endpoint origin</text>  <line x1="832" y1="896" x2="1408" y2="896" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="846" cy="896" r="11" fill="#2b6cb0"/>  <text class="num" x="846" y="900" text-anchor="middle">14</text>  <text class="ml" x="1120.0" y="887" text-anchor="middle">HTTPS POST subscription.endpoint</text>  <text class="ms" x="1120.0" y="912" text-anchor="middle">Authorization: vapid t=&lt;JWT&gt;, k=&lt;pubkey&gt;  |  Ttl: 60</text>  <line x1="1408" y1="946" x2="832" y2="946" stroke="#718096" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrR)"/>  <circle cx="1394" cy="946" r="11" fill="#718096"/>  <text class="num" x="1394" y="950" text-anchor="middle">15</text>  <text class="ml" x="1120.0" y="937" text-anchor="middle">201 Created  (404/410: DELETE row)</text>  <text class="ms" x="1120.0" y="962" text-anchor="middle">vendor sees ciphertext only</text>  <line x1="1408" y1="996" x2="412" y2="996" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="1394" cy="996" r="11" fill="#2b6cb0"/>  <text class="num" x="1394" y="1000" text-anchor="middle">16</text>  <text class="ml" x="910.0" y="987" text-anchor="middle">deliver encrypted payload</text>  <text class="ms" x="910.0" y="1012" text-anchor="middle">desktop: browser TLS   mobile: via OS (FCM / APNs / WNS)</text>  <line x1="412" y1="1046" x2="1668" y2="1046" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="426" cy="1046" r="11" fill="#2b6cb0"/>  <text class="num" x="426" y="1050" text-anchor="middle">17</text>  <text class="ml" x="1040.0" y="1037" text-anchor="middle">wake worker, fire 'push'</text>  <text class="ms" x="1040.0" y="1062" text-anchor="middle">browser decrypts aes128gcm with p256dh + auth</text>  <line x1="1692" y1="1096" x2="1888" y2="1096" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="1706" cy="1096" r="11" fill="#2b6cb0"/>  <text class="num" x="1706" y="1100" text-anchor="middle">18</text>  <text class="ml" x="1712" y="1087" text-anchor="start">showNotification(...)</text>  <text class="ms" x="1712" y="1112" text-anchor="start">JSON.parse(atob(payload))</text>  <line x1="1888" y1="1146" x2="142" y2="1146" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="1874" cy="1146" r="11" fill="#2b6cb0"/>  <text class="num" x="1874" y="1150" text-anchor="middle">19</text>  <text class="ml" x="1868" y="1137" text-anchor="end">banner / tray / lock screen</text>  <text class="ms" x="1868" y="1162" text-anchor="end">title, body, icon, actions</text>  <line x1="142" y1="1196" x2="1888" y2="1196" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="156" cy="1196" r="11" fill="#2b6cb0"/>  <text class="num" x="156" y="1200" text-anchor="middle">20</text>  <text class="ml" x="162" y="1187" text-anchor="start">clicks notification</text>  <line x1="1888" y1="1246" x2="1692" y2="1246" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="1874" cy="1246" r="11" fill="#2b6cb0"/>  <text class="num" x="1874" y="1250" text-anchor="middle">21</text>  <text class="ml" x="1868" y="1237" text-anchor="end">notificationclick</text>  <line x1="1668" y1="1296" x2="832" y2="1296" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrD)"/>  <circle cx="1654" cy="1296" r="11" fill="#2b6cb0"/>  <text class="num" x="1654" y="1300" text-anchor="middle">22</text>  <text class="ml" x="1250.0" y="1287" text-anchor="middle">clients.openWindow(action)</text>  <text class="ms" x="1250.0" y="1312" text-anchor="middle">session-authenticated ILIAS request, default '/'</text>  <rect x="20" y="1370" width="1980" height="190" rx="10" fill="#ffffff" stroke="#a0aec0"/>  <text class="ph" x="40" y="1394" fill="#2d3748">How to read this, and what the default configuration implies</text>  <text class="bul" x="40" y="1418">&#8226;  The endpoint in step 5 is the only routing information ILIAS ever has. Step 14 posts to that stored URL; there is no FCM / Autopush / APNs switch in PHP.</text>  <text class="bul" x="40" y="1440">&#8226;  The VAPID JWT in step 13 uses aud = scheme://host of that same endpoint, so the signature is valid only for the vendor that issued the subscription.</text>  <text class="bul" x="40" y="1462">&#8226;  A user with Chrome and Firefox produces two rows and two POSTs. 404 or 410 in step 15 deletes that row immediately (stale subscription cleanup).</text>  <text class="bul" x="40" y="1484">&#8226;  Push is not an ilNotificationSystem channel (osd / mail). It runs synchronously in the triggering request and has no queue or cron.</text>  <text class="bul" x="40" y="1506">&#8226;  Three permissions must all be granted: ILIAS enable_push, the browser Notification permission (step 3), and the OS permission for the browser app.</text>  <text class="bul" x="40" y="1528">&#8226;  iOS / iPadOS only complete steps 16-19 when the site is installed as a home-screen PWA. The service worker is registered on every page by Basic.js, independently of push settings.</text></svg>
